<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer glowing ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#brandGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.8" />
  <!-- Rounded shield / core node -->
  <rect x="25" y="25" width="50" height="50" rx="16" fill="#111827" stroke="url(#brandGrad)" stroke-width="3" filter="url(#glow)" />
  <!-- Central Neural Brain / RAG nodes -->
  <path d="M50 35 L50 65 M35 50 L65 50 M39 39 L61 61 M61 39 L39 61" stroke="#818CF8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <circle cx="50" cy="50" r="8" fill="url(#brandGrad)" />
  <circle cx="36" cy="36" r="4" fill="#06B6D4" />
  <circle cx="64" cy="36" r="4" fill="#A78BFA" />
  <circle cx="36" cy="64" r="4" fill="#38BDF8" />
  <circle cx="64" cy="64" r="4" fill="#C084FC" />
</svg>
